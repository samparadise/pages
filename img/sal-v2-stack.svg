      <path d="M0,0 L10,5 L0,10 z" fill="#888"/>
    </marker>
  </defs>

  <g fill="#222" stroke="#555" stroke-width="1">
    <rect x="20" y="200" width="130" height="50" rx="4"/>
    <rect x="210" y="200" width="190" height="50" rx="4"/>
    <rect x="210" y="50" width="190" height="64" rx="4"/>
    <rect x="470" y="122" width="200" height="64" rx="4"/>
    <rect x="740" y="175" width="220" height="90" rx="4"/>
